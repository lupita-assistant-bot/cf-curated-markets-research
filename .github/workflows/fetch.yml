name: Fetch research pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
      - 'results2/**'
      - 'fetch.log'
  workflow_dispatch:
    inputs:
      jobfile:
        description: 'jobs file'
        required: false
        default: 'jobs.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: fetch-research
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and parse
        run: |
          python fetch2.py "${{ github.event.inputs.jobfile || 'jobs.txt' }}" 2>&1 | tee fetch2.log

      - name: Commit results
        run: |
          git config user.name 'research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add -A results2 fetch2.log 2>/dev/null || true
          git commit -m "research results $(date -u +%Y%m%d-%H%M%S)" || echo 'nothing to commit'
          git push || echo 'push failed'

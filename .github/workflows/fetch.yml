name: Fetch research pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      urlfile:
        description: 'URL file to fetch'
        required: false
        default: 'urls.txt'

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and parse
        run: |
          python fetch.py "${{ github.event.inputs.urlfile || 'urls.txt' }}" results/manifest.json 2>&1 | tee fetch.log

      - name: Commit results
        run: |
          git config user.name 'research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add -A results fetch.log 2>/dev/null || true
          git commit -m "research results $(date -u +%Y%m%d-%H%M%S)" || echo 'nothing to commit'
          git push || echo 'push failed'
